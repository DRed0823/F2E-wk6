<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Vegetables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 頂部導覽列 -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Fresh Vegetables</h1>
            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">Vegetables</a>
                <a href="#">Online</a>
                <a href="#">Contact</a>
            </nav>
            <div class="auth-buttons">
                <a href="#" class="btn-login">LOGIN</a>
                <a href="#" class="btn-join">JOIN</a>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="main-content">
        <!-- Banner 區塊 -->
        <section class="banner">
            <img src="images/img_main_pumpkin.png" alt="Fresh Vegetables Banner">
        </section>

        <!-- 內文與小卡片區塊 -->
        <section class="vegetables-section">
            <h2>Fresh Vegetables for a Healthier Life</h2>
            <div class="cards-container">
                <div class="card">
                    <img src="images/carrots.png" alt="Carrots">
                    <p>Carrots</p>
                </div>
                <div class="card">
                    <img src="images/corn.png" alt="Corn">
                    <p>Corn</p>
                </div>
                <div class="card">
                    <img src="images/pepper.png" alt="Pepper">
                    <p>Pepper</p>
                </div>
            </div>
        </section>

        <!-- 聯絡表單區塊 -->
        <section class="contact-section">
            <!-- 放置聯絡資訊與表單 -->
        </section>
    </main>

    <!-- 頁尾 -->
    <footer class="footer">
        <p>Copyright 2017 Vegetables club / Design by Vegetables</p>
    </footer>
</body>
</html>
